{{ define "main" }}
<article class="post">
    <header class="post-header">
        <h1>{{ .Title }}</h1>
        <div class="post-meta">
            <span class="date">Última actualización: {{ .Lastmod.Format "02/01/2006" }}</span>
            {{ with .Params.categories }}
            <span class="category">Categoría: <a href="{{ "/categories/" | relURL }}{{ index . 0 | urlize }}">{{ index . 0 }}</a></span>
            {{ end }}
        </div>
    </header>

    <div class="toc-container widget">
        <h3>Tabla de Contenidos</h3>
        {{ .TableOfContents }}
    </div>

    <!-- AdSense In-Content Placeholder (Top) -->
    <div class="ad-placeholder ad-content">
        <!-- Espacio reservado para AdSense (Debajo del TOC) -->
    </div>

    <div class="post-content">
        {{ .Content }}
    </div>

    <!-- AdSense In-Content Placeholder (Bottom) -->
    <div class="ad-placeholder ad-content">
        <!-- Espacio reservado para AdSense (Al final del artículo) -->
    </div>
</article>
{{ end }}
