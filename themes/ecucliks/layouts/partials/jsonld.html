{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ site.Title }}",
  "url": "{{ "/" | absURL }}",
  "description": "{{ site.Params.description }}",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "{{ "buscar/?q={search_term_string}" | absURL }}",
    "query-input": "required name=search_term_string"
  }
}
</script>
{{ else if and .IsPage (in site.Params.mainSections .Type) }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  },
  "headline": "{{ .Title }}",
  "description": "{{ .Summary | plainify }}",
  "author": {
    "@type": "Organization",
    "name": "{{ site.Params.author }}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "{{ site.Title }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ "favicon.jpg" | absURL }}"
    }
  }{{ if not .Date.IsZero }},
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}"{{ end }}{{ if not .Lastmod.IsZero }},
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}"{{ end }}
}
</script>
{{ else if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "{{ .Title }}",
  "url": "{{ .Permalink }}",
  "description": "{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}",
  "publisher": {
    "@type": "Organization",
    "name": "{{ site.Title }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ "favicon.jpg" | absURL }}"
    }
  }
}
</script>
{{ end }}
