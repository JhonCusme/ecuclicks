name: Mantenimiento y SEO de Guías

on:
  schedule:
    # Se ejecuta los días 1 y 15 de cada mes a la medianoche (UTC)
    - cron: '0 0 1,15 * *'
  workflow_dispatch: # Permite ejecución manual

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      - name: Ejecutar script de mantenimiento
        run: python scripts/update_guides.py

      - name: Commit y Push de Cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          
          # Solo hacer commit si hay cambios
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: mantenimiento automático SEO y actualización de lastmod [skip ci]"
            git push
          else
            echo "No hay cambios para hacer commit"
          fi
