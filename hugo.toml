baseURL = "https://ecuclicks.online"
languageCode = "es-ec"
defaultContentLanguage = "es"
title = "Ecuclicks - Guías y Trámites de Ecuador"
theme = "ecucliks"
paginate = 10
enableRobotsTXT = true

[minify]
  disableHTML = false
  disableCSS = false
  disableJS = false
  minifyOutput = true

[outputs]
  home = ["HTML", "JSON"]

[taxonomies]
  category = "categories"

[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "categories"
    weight = 100

[params]
  description = "Portal de guías paso a paso para realizar trámites en Ecuador (SRI, Registro Civil, ANT, IESS y más)."
  author = "Ecuclicks"
  mainSections = ["identificacion", "impuestos", "seguridad-social", "vehiculos", "extranjeria", "empresas", "otros"]
  
  # AdSense Client ID
  adsense_client_id = "ca-pub-7223873610943022"

[markup.tableOfContents]
  endLevel = 3
  ordered = false
  startLevel = 2

[menu]
  [[menu.main]]
    name = "Inicio"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Trámites"
    url = "/categories/"
    weight = 2
  [[menu.main]]
    name = "Sobre Nosotros"
    url = "/sobre-nosotros/"
    weight = 3
  [[menu.main]]
    name = "Contacto"
    url = "/contacto/"
    weight = 4
